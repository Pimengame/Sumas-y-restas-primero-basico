<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magia del 10 - Totalmente Interactivo y Táctil</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            background-color: #e8f5e9; 
            text-align: center; 
            color: #333; 
            margin: 0;
            padding: 10px;
        }
        h1 { color: #2e7d32; margin-bottom: 5px; font-size: 32px;}
        .subtitle { color: #555; font-size: 16px; margin-bottom: 15px;}
        
        .game-board {
            background-color: white; max-width: 800px; margin: 0 auto;
            border-radius: 20px; padding: 15px 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            min-height: 500px; position: relative;
        }

        /* --- PANTALLAS --- */
        .screen { display: none; }
        .screen.active { display: block; }

        /* --- MENÚ PRINCIPAL --- */
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 30px; }
        .btn-menu {
            width: 300px; padding: 15px; font-size: 22px; border-radius: 30px;
            cursor: pointer; border: none; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .btn-menu:active { transform: scale(0.95); }
        .btn-suma { background-color: #43a047; }
        .btn-resta { background-color: #e53935; }
        .btn-tuto-suma { background-color: #81c784; color: #1b5e20; border: 3px solid #43a047;}
        .btn-tuto-resta { background-color: #ef9a9a; color: #b71c1c; border: 3px solid #e53935;}
        
        .btn-volver {
            background-color: #9e9e9e; color: white; border: none; padding: 10px 20px;
            border-radius: 20px; cursor: pointer; font-size: 16px; margin-bottom: 10px; float: left;
        }

        /* --- EL BÚHO --- */
        .teacher-box {
            background-color: #fff9c4; border: 3px solid #fbc02d; border-radius: 15px;
            padding: 10px 15px; font-size: 17px; color: #d84315; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px; text-align: left; clear: both;
        }
        .owl { font-size: 40px; }
        .btn-hablar {
            background-color: #ff9800; border: none; border-radius: 50%; width: 40px; height: 40px;
            font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: transform 0.1s; flex-shrink: 0;
        }
        .btn-hablar:active { transform: scale(0.9); }

        /* --- ZONA VISUAL (Cajas de 10) --- */
        .visual-area {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 15px;
            padding: 15px; background-color: #f1f8e9; border-radius: 15px; border: 2px dashed #a5d6a7;
        }
        .frame-container { display: flex; flex-direction: column; align-items: center; }
        .frame-title { font-size: 15px; font-weight: bold; color: #555; margin-bottom: 5px; }
        
        .ten-frame {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background-color: #fff;
            padding: 6px; border: 3px solid #7cb342; border-radius: 8px; transition: all 0.3s ease;
        }
        .ten-frame.full { border-color: #fbc02d; background-color: #fffde7; box-shadow: 0 0 15px rgba(251, 192, 45, 0.6); }
        
        /* Celdas Interactivas */
        .cell {
            width: 45px; height: 45px; border: 2px solid #e0e0e0; border-radius: 5px;
            display: flex; justify-content: center; align-items: center; font-size: 32px; 
            transition: all 0.2s; user-select: none;
        }
        .cell.interactive { cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .cell.interactive:hover { transform: scale(1.1); border-color: #ff9800; }
        .cell.interactive:active { transform: scale(0.9); }
        
        /* Indicador visual de toque (animación tipo "pop") */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .pop-anim { animation: pop 0.3s ease; }

        /* Efectos visuales de estado */
        .cell.moved { opacity: 0.2; transform: scale(0.8); } /* Suma: se fue a la otra caja */
        
        .cell.removed { opacity: 0.4; transform: scale(0.85); filter: grayscale(100%); position: relative; } /* Resta: tachada */
        .cell.removed::after {
            content: ''; position: absolute; width: 100%; height: 5px; background-color: #e53935;
            transform: rotate(-45deg); border-radius: 3px; box-shadow: 0 0 3px rgba(255,255,255,0.8);
        }
        .cell.removed::before {
            content: ''; position: absolute; width: 100%; height: 5px; background-color: #e53935;
            transform: rotate(45deg); border-radius: 3px; box-shadow: 0 0 3px rgba(255,255,255,0.8);
        }

        /* --- ZONA MATEMÁTICA --- */
        .math-container {
            display: flex; justify-content: center; align-items: flex-start; font-size: 45px; 
            font-weight: bold; color: #283593; gap: 15px; transition: all 0.5s;
        }
        .num-main { margin-top: 10px; transition: all 0.5s;}
        .num-group { display: flex; flex-direction: column; align-items: center; }
        .ramas { font-size: 30px; color: #9e9e9e; letter-spacing: 15px; margin-top: -15px; margin-bottom: -5px; }
        .inputs-row { display: flex; gap: 10px; }

        input {
            width: 50px; height: 50px; font-size: 26px; text-align: center;
            border: 3px dashed #ab47bc; border-radius: 12px;
            background-color: #fdf3ff; color: #4a148c; font-family: inherit;
        }
        /* Resaltar visualmente qué input se está llenando con los toques */
        input.active-fill { border-style: solid; border-color: #ff9800; background-color: #fff3e0; box-shadow: 0 0 10px rgba(255, 152, 0, 0.5); transition: all 0.3s;}
        
        input:focus { outline: none; }
        input:disabled { background-color: #eeeeee; border: 3px solid #bdbdbd; color: #9e9e9e; }
        
        .labels-row { display: flex; gap: 10px; font-size: 13px; color: #666; margin-top: 5px; justify-content: center; font-weight: normal; }
        .lbl-box { width: 50px; text-align: center; line-height: 1.1; }

        /* --- FILA MÁGICA DEL 10 --- */
        .magic-row {
            background-color: #fffde7; border: 3px dashed #fbc02d; border-radius: 15px;
            padding: 10px 15px; margin-top: 10px; margin-bottom: 15px; align-items: center;
        }
        .magic-ten { color: #fbc02d; font-size: 55px; text-shadow: 2px 2px 0px #fff, -1px -1px 0px #fff; }
        .result-box input { border-color: #4caf50; background-color: #e8f5e9; color: #1b5e20; width: 70px; }
        
        .cross-out { text-decoration: line-through; opacity: 0.4; transform: scale(0.9); }

        .btn-accion {
            padding: 12px 25px; font-size: 20px; font-family: inherit;
            background-color: #ff9800; color: white; border: none; border-radius: 30px; 
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-top: 5px;
        }
        .btn-accion:hover { background-color: #f57c00; }
        .feedback { font-size: 20px; font-weight: bold; margin-top: 10px; min-height: 25px;}
        .correct { color: #2e7d32; }
        .wrong { color: #d32f2f; }

        /* Estilos Restas */
        .modo-resta .ten-frame { border-color: #e57373; }
        .modo-resta input { border-color: #ef5350; background-color: #ffebee; color: #b71c1c; }
        .modo-resta .math-container { color: #b71c1c; }
        .modo-resta .magic-row { background-color: #ffebee; border-color: #ef5350; }
        .modo-resta .magic-ten { color: #ef5350; }
    </style>
</head>
<body>

    <h1>✨ El Truco del 10 ✨</h1>
    <p class="subtitle">¡Toca las manzanas para resolver!</p>
    
    <div class="game-board" id="board">
        
        <!-- PANTALLA MENÚ -->
        <div id="pantalla-menu" class="screen active">
            <h2>¿Qué quieres hacer hoy?</h2>
            <div class="menu-buttons">
                <button class="btn-menu btn-tuto-suma" onclick="iniciarTutorial('suma')">📖 Ver Ejemplo de Suma</button>
                <button class="btn-menu btn-suma" onclick="prepararJuego('suma')">➕ Jugar a Sumar</button>
                <br>
                <button class="btn-menu btn-tuto-resta" onclick="iniciarTutorial('resta')">📖 Ver Ejemplo de Resta</button>
                <button class="btn-menu btn-resta" onclick="prepararJuego('resta')">➖ Jugar a Restar</button>
            </div>
        </div>

        <!-- PANTALLA JUEGO -->
        <div id="pantalla-juego" class="screen">
            <button class="btn-volver" onclick="volverMenu()">⬅ Volver al Menú</button>
            
            <div class="teacher-box">
                <div class="owl" onclick="hablarBúho()" style="cursor:pointer;" title="Haz clic en el búho para escucharlo">🦉</div>
                <div id="textoProfesor" style="flex-grow: 1;">...</div>
                <button class="btn-hablar" onclick="hablarBúho()" title="Escuchar">🔊</button>
            </div>
            
            <!-- CAJAS DE 10 -->
            <div class="visual-area">
                <div class="frame-container">
                    <div class="frame-title" id="titulo-caja1">Primera Caja</div>
                    <div class="ten-frame" id="caja1"></div>
                </div>
                <div style="font-size: 40px; font-weight: bold; margin-top: 30px;" id="signo-visual">+</div>
                <div class="frame-container">
                    <div class="frame-title" id="titulo-caja2">Segunda Caja</div>
                    <div class="ten-frame" id="caja2"></div>
                </div>
            </div>

            <!-- FILA 1: DESCOMPOSICIÓN -->
            <div class="math-container" id="fila-descomposicion">
                <div class="num-main" id="contenedor-n1"><span id="num1">8</span></div>
                <div class="num-main" id="signo-matematico">+</div>
                
                <div class="num-group">
                    <span id="num2">5</span>
                    <div class="ramas">/ \</div>
                    <div class="inputs-row">
                        <input type="number" id="parte1" placeholder="?" min="0" oninput="sincronizarInputDesdeTeclado()">
                        <input type="number" id="parte2" placeholder="?" min="0" oninput="sincronizarInputDesdeTeclado()">
                    </div>
                    <div class="labels-row">
                        <div class="lbl-box" id="lbl1"></div>
                        <div class="lbl-box" id="lbl2"></div>
                    </div>
                </div>
            </div>

            <!-- FILA 2: MAGIA DEL 10 -->
            <div class="math-container magic-row" id="fila-magica" style="display: none;">
                <div class="magic-ten">10</div>
                <div class="num-main" id="signo-magico">+</div>
                <div class="num-main" id="num-sobrante" style="color: #ff9800; font-size: 55px;">3</div>
                <div class="num-main">=</div>
                <div class="result-box">
                    <input type="number" id="resultadoFinal" disabled placeholder="?">
                </div>
            </div>

            <button class="btn-accion" id="btnAccion" onclick="procesarAccion()">Revisar</button>
            <div class="feedback" id="mensaje"></div>
        </div>

    </div>

    <script>
        let n1, n2, p1_correcto, p2_correcto, resultado_correcto;
        let modoJuego = ''; 
        let esTutorial = false;
        let pasoActual = 1;
        const emoji = '🍎';
        
        // Variables para el control táctil
        let toques_p1 = 0;
        let toques_p2 = 0;
        let estado_tactil = 'llenando_p1'; // 'llenando_p1', 'llenando_p2', 'bloqueado'

        // --- VOZ ---
        function cambiarTextoYHablar(nuevoHTML) {
            document.getElementById('textoProfesor').innerHTML = nuevoHTML;
            hablarBúho();
        }

        function hablarBúho() {
            window.speechSynthesis.cancel();
            let textoLimpio = document.getElementById('textoProfesor').innerHTML.replace(/<[^>]*>?/gm, ' ');
            let mensaje = new SpeechSynthesisUtterance(textoLimpio);
            mensaje.lang = 'es-CL'; mensaje.rate = 0.9; mensaje.pitch = 1.3;
            window.speechSynthesis.speak(mensaje);
        }

        function volverMenu() {
            window.speechSynthesis.cancel();
            document.getElementById('pantalla-juego').classList.remove('active');
            document.getElementById('pantalla-menu').classList.add('active');
            document.getElementById('board').className = 'game-board';
        }

        function cambiarPantallaJuego(modo) {
            document.getElementById('pantalla-menu').classList.remove('active');
            document.getElementById('pantalla-juego').classList.add('active');
            
            if (modo === 'resta') {
                document.getElementById('board').classList.add('modo-resta');
                document.getElementById('signo-visual').innerText = '➖';
                document.getElementById('signo-matematico').innerText = '−';
                document.getElementById('signo-magico').innerText = '−';
                document.getElementById('lbl1').innerText = "Quitar sueltos";
                document.getElementById('lbl2').innerText = "Quitar al 10";
            } else {
                document.getElementById('board').classList.remove('modo-resta');
                document.getElementById('signo-visual').innerText = '➕';
                document.getElementById('signo-matematico').innerText = '+';
                document.getElementById('signo-magico').innerText = '+';
                document.getElementById('lbl1').innerText = "Para el 10";
                document.getElementById('lbl2').innerText = "Lo que sobra";
            }
        }

        // ==========================================
        // SISTEMA TÁCTIL E INTERACTIVO
        // ==========================================
        
        // Función principal para redibujar basándonos en los toques
        function actualizarVisualesDesdeToques() {
            let caja1 = document.getElementById('caja1');
            let caja2 = document.getElementById('caja2');
            
            // Actualizar los inputs con los valores táctiles (si el usuario no está escribiendo manualmente)
            document.getElementById('parte1').value = toques_p1 > 0 ? toques_p1 : '';
            document.getElementById('parte2').value = toques_p2 > 0 ? toques_p2 : '';

            // Efectos visuales de qué input se está llenando
            document.getElementById('parte1').classList.toggle('active-fill', estado_tactil === 'llenando_p1' && pasoActual === 1);
            document.getElementById('parte2').classList.toggle('active-fill', estado_tactil === 'llenando_p2' && pasoActual === 1);

            caja1.innerHTML = '';
            caja2.innerHTML = '';

            if (modoJuego === 'suma') {
                // SUMA: toques_p1 mueve manzanas de Caja 2 a Caja 1. (toques_p2 es el resto)
                let manzanasEnCaja1 = n1 + toques_p1;
                let manzanasRestantesCaja2 = n2 - toques_p1;

                // Dibujar Caja 1 (Recibe las manzanas)
                for (let i = 0; i < 10; i++) {
                    let celda = document.createElement('div');
                    celda.className = 'cell';
                    if (i < manzanasEnCaja1) celda.innerText = emoji;
                    caja1.appendChild(celda);
                }
                
                // Brillar si formó el 10
                if (manzanasEnCaja1 === 10) caja1.classList.add('full'); else caja1.classList.remove('full');

                // Dibujar Caja 2 (Origen interactivo)
                for (let i = 0; i < 10; i++) {
                    let celda = document.createElement('div');
                    celda.className = 'cell';
                    
                    if (i < manzanasRestantesCaja2) {
                        celda.innerText = emoji;
                        // Solo son interactivas si aún no llenamos la caja 1
                        if (manzanasEnCaja1 < 10 && !esTutorial && pasoActual === 1) {
                            celda.classList.add('interactive');
                            celda.onclick = () => procesarToqueInteractivo('suma');
                        }
                    } else if (i < n2) {
                        // Estas son las que se movieron a la Caja 1 (efecto fantasma)
                        celda.innerText = emoji;
                        celda.classList.add('moved'); 
                    }
                    caja2.appendChild(celda);
                }
                
                // En suma, si ya llenó la caja 1, autocompletamos el sobrante en parte2
                if (manzanasEnCaja1 === 10 && toques_p1 === p1_correcto && toques_p2 === 0 && pasoActual === 1 && !esTutorial) {
                    toques_p2 = manzanasRestantesCaja2;
                    document.getElementById('parte2').value = toques_p2;
                    estado_tactil = 'bloqueado'; // Ya terminó la fase táctil
                    actualizarVisualesDesdeToques(); // Refrescar para quitar highlight
                    hablarBúho("¡Excelente! Haz clic en Revisar Descomposición."); // Mensaje rápido sin cambiar texto visual
                }

            } else {
                // RESTA: toques_p1 tacha de Caja 2. toques_p2 tacha de Caja 1.
                let sueltos = n1 - 10;

                // Dibujar Caja 2 (Sueltos)
                for (let i = 0; i < 10; i++) {
                    let celda = document.createElement('div');
                    celda.className = 'cell';
                    
                    if (i < sueltos) {
                        celda.innerText = emoji;
                        if (i >= sueltos - toques_p1) {
                            celda.classList.add('removed'); // Tachada
                        } else if (!esTutorial && pasoActual === 1 && estado_tactil === 'llenando_p1') {
                            celda.classList.add('interactive');
                            celda.onclick = () => procesarToqueInteractivo('resta_sueltos');
                        }
                    }
                    caja2.appendChild(celda);
                }

                // Dibujar Caja 1 (El 10 principal)
                for (let i = 0; i < 10; i++) {
                    let celda = document.createElement('div');
                    celda.className = 'cell';
                    celda.innerText = emoji;
                    
                    if (i >= 10 - toques_p2) {
                        celda.classList.add('removed'); // Tachada
                    } else if (!esTutorial && pasoActual === 1 && estado_tactil === 'llenando_p2' && toques_p1 + toques_p2 < n2) {
                        // Solo permite tachar si ya terminó los sueltos y aún faltan por tachar del total(n2)
                        celda.classList.add('interactive');
                        celda.onclick = () => procesarToqueInteractivo('resta_diez');
                    }
                    caja1.appendChild(celda);
                }

                if (toques_p2 > 0) caja1.classList.remove('full'); else caja1.classList.add('full');
            }
        }

        function procesarToqueInteractivo(accion) {
            // Animación de pop en el input correspondiente
            let inputId = (accion === 'resta_diez') ? 'parte2' : 'parte1';
            let inputEl = document.getElementById(inputId);
            inputEl.classList.remove('pop-anim');
            void inputEl.offsetWidth; // Trigger reflow
            inputEl.classList.add('pop-anim');

            if (accion === 'suma') {
                toques_p1++;
                // Reproducir un sonido cortito de "pop" genérico usando web audio api si se quisiera (omitido por simplicidad)
            } else if (accion === 'resta_sueltos') {
                toques_p1++;
                let sueltos = n1 - 10;
                // Si tachó todos los sueltos, cambia el estado a tachar el 10
                if (toques_p1 === sueltos) {
                    estado_tactil = 'llenando_p2';
                }
            } else if (accion === 'resta_diez') {
                toques_p2++;
                // Si ya tachó el total necesario (n2), bloquea más toques
                if (toques_p1 + toques_p2 === n2) {
                    estado_tactil = 'bloqueado';
                }
            }
            
            actualizarVisualesDesdeToques();
        }

        // Permite que si el niño prefiere escribir en el teclado, también funcione
        function sincronizarInputDesdeTeclado() {
            if (pasoActual !== 1 || esTutorial) return;
            
            let val1 = parseInt(document.getElementById('parte1').value);
            let val2 = parseInt(document.getElementById('parte2').value);
            
            toques_p1 = isNaN(val1) || val1 < 0 ? 0 : val1;
            toques_p2 = isNaN(val2) || val2 < 0 ? 0 : val2;
            
            // Ajustar estado táctil según lo escrito para no bloquearlo
            if (modoJuego === 'resta') {
                if (toques_p1 >= (n1 - 10)) estado_tactil = 'llenando_p2';
                else estado_tactil = 'llenando_p1';
            }

            actualizarVisualesDesdeToques();
        }
        // ==========================================


        function prepararJuego(modo) {
            modoJuego = modo; esTutorial = false;
            cambiarPantallaJuego(modo); generarNivel();
        }

        function iniciarTutorial(modo) {
            modoJuego = modo; esTutorial = true;
            cambiarPantallaJuego(modo);
            if (modo === 'suma') { n1 = 8; n2 = 5; } else { n1 = 14; n2 = 6; }
            
            configurarPantallaInicial();
            document.getElementById('parte1').disabled = true; document.getElementById('parte2').disabled = true;
            document.getElementById('resultadoFinal').disabled = true;
            
            if (modo === 'suma') {
                cambiarTextoYHablar(`<b>EJEMPLO DE SUMA:</b> Para sumar 8 más 5, primero convertimos el 8 en un 10. ¿Cuánto le falta al 8? Le faltan <b>2</b>. Haz clic en "Siguiente Paso".`);
            } else {
                cambiarTextoYHablar(`<b>EJEMPLO DE RESTA:</b> Tenemos que tachar <b>6</b> manzanas en total. Primero, desarmemos el 6 tachando las <b>4</b> manzanas sueltas. Haz clic en "Siguiente".`);
            }
            document.getElementById('btnAccion').innerText = "Siguiente Paso ➡";
        }

        function generarNivel() {
            if (modoJuego === 'suma') {
                n1 = Math.floor(Math.random() * 3) + 7; n2 = Math.floor(Math.random() * 5) + 4; 
                if (n1 + n2 <= 10) { generarNivel(); return; }
            } else {
                n1 = Math.floor(Math.random() * 5) + 11; n2 = Math.floor(Math.random() * 5) + 4;  
                if (n1 - n2 >= 10 || n1 - n2 <= 0) { generarNivel(); return; }
            }
            configurarPantallaInicial();
        }

        function configurarPantallaInicial() {
            pasoActual = 1;
            toques_p1 = 0;
            toques_p2 = 0;
            estado_tactil = 'llenando_p1';
            
            document.getElementById('contenedor-n1').classList.remove('cross-out');
            document.getElementById('parte1').classList.remove('cross-out');
            document.getElementById('fila-magica').style.display = 'none';
            document.getElementById('mensaje').innerText = '';
            document.getElementById('parte1').disabled = false; 
            document.getElementById('parte2').disabled = false; 
            document.getElementById('resultadoFinal').disabled = true;
            document.getElementById('resultadoFinal').value = '';
            
            if (modoJuego === 'suma') {
                p1_correcto = 10 - n1; p2_correcto = n2 - p1_correcto; resultado_correcto = n1 + n2;
                document.getElementById('titulo-caja1').innerText = "Hay " + n1;
                document.getElementById('titulo-caja2').innerText = "Hay " + n2;
                
                if (!esTutorial) cambiarTextoYHablar(`<b>¡Toca las manzanas de la segunda caja para pasarlas a la primera!</b> Llena la primera caja hasta tener 10.`);
            } else {
                p1_correcto = n1 - 10; p2_correcto = n2 - p1_correcto; resultado_correcto = n1 - n2;
                document.getElementById('titulo-caja1').innerText = "Unidad de 10";
                document.getElementById('titulo-caja2').innerText = "Sueltos: " + (n1 - 10);
                
                if (!esTutorial) cambiarTextoYHablar(`¡Atención! Tenemos que tachar <b>${n2}</b> manzanas en total. <b>Toca las manzanas sueltas de la derecha para empezar a tachar.</b>`);
            }

            document.getElementById('num1').innerText = n1; document.getElementById('num2').innerText = n2;
            
            // Dibujar la configuración inicial limpia
            actualizarVisualesDesdeToques();
            
            if (!esTutorial) { document.getElementById('btnAccion').innerText = "Revisar Descomposición"; }
        }

        function procesarAccion() {
            if (esTutorial) { ejecutarPasoTutorial(); } else { revisarJuego(); }
        }

        function mostrarFilaMagica() {
            document.getElementById('parte1').disabled = true; document.getElementById('parte2').disabled = true;
            document.getElementById('contenedor-n1').classList.add('cross-out');
            document.getElementById('parte1').classList.add('cross-out');
            document.getElementById('num-sobrante').innerText = p2_correcto;
            document.getElementById('fila-magica').style.display = 'flex';
            
            // Quitar highlights
            document.getElementById('parte1').classList.remove('active-fill');
            document.getElementById('parte2').classList.remove('active-fill');
            estado_tactil = 'bloqueado';

            document.getElementById('resultadoFinal').disabled = false;
            document.getElementById('resultadoFinal').focus();
            document.getElementById('btnAccion').innerText = "Revisar Resultado Final";
            pasoActual = 2;
        }

        function ejecutarPasoTutorial() {
            if (pasoActual === 1) {
                toques_p1 = p1_correcto; toques_p2 = p2_correcto;
                actualizarVisualesDesdeToques(); // Reflejar los cambios automáticos
                mostrarFilaMagica();
                
                if (modoJuego === 'suma') {
                    cambiarTextoYHablar(`¡Mira! Juntamos el ${n1} con el ${p1_correcto} y <b>se transformaron en un 10</b>. Ahora solo haz la nueva operación de abajo: <b>10 más ${p2_correcto}</b>.`);
                } else {
                    cambiarTextoYHablar(`Como debíamos tachar ${n2} en total, tachamos los ${p1_correcto} sueltos y luego le tachamos ${p2_correcto} al número 10. ¡Cuenta las manzanas vivas!`);
                }
                
            } else if (pasoActual === 2) {
                document.getElementById('resultadoFinal').value = resultado_correcto;
                if (modoJuego === 'suma') {
                    cambiarTextoYHablar(`¡Excelente! 10 más ${p2_correcto} es igual a <b>${resultado_correcto}</b>.`);
                } else {
                    cambiarTextoYHablar(`¡Así es! Si a 10 le quitamos ${p2_correcto}, nos quedan <b>${resultado_correcto}</b> manzanas vivas.`);
                }
                document.getElementById('btnAccion').innerText = "Volver al Menú"; pasoActual = 3;
            } else if (pasoActual === 3) { volverMenu(); }
        }

        function revisarJuego() {
            let msj = document.getElementById('mensaje');
            if (pasoActual === 1) {
                // Usamos los valores de toques (que se sincronizan con los inputs)
                if (toques_p1 === 0 && toques_p2 === 0 && document.getElementById('parte1').value === '') { 
                    msj.innerText = modoJuego === 'suma' ? "¡Toca las manzanas para moverlas!" : "¡Toca las manzanas para tacharlas!"; 
                    msj.className = "feedback wrong"; return; 
                }

                if (toques_p1 === p1_correcto && toques_p2 === p2_correcto) {
                    msj.innerText = "¡Bien hecho!"; msj.className = "feedback correct";
                    mostrarFilaMagica();
                    
                    if (modoJuego === 'suma') {
                        document.getElementById('titulo-caja1').innerHTML = "¡Caja de 10 llena! 🌟";
                        cambiarTextoYHablar(`¡Súper! Juntaste el ${n1} y el ${p1_correcto} para formar un <b>10</b>. Ahora resuelve la operación de la Fila Mágica: <b>10 más ${p2_correcto}</b>.`);
                    } else {
                        document.getElementById('titulo-caja2').innerText = "¡Suprimidos!";
                        cambiarTextoYHablar(`¡Misión cumplida! Si cuentas las cruces rojas, verás que tachaste exactamente <b>${n2}</b> manzanas en total. Ahora resuelve la Fila Mágica contando las manzanas vivas.`);
                    }
                } else if (toques_p1 + toques_p2 !== n2) {
                    msj.innerText = `¡Cuidado! En total debes ${modoJuego === 'suma' ? 'mover y separar' : 'tachar'} ${n2} manzanas, no ${toques_p1 + toques_p2}.`; msj.className = "feedback wrong";
                } else if (toques_p1 !== p1_correcto) {
                    msj.innerText = modoJuego === 'suma' ? `Para llegar a 10, debías mover exactamente ${p1_correcto} manzanas.` : `Primero debes tachar EXACTAMENTE todas las manzanas sueltas (${p1_correcto}).`;
                    msj.className = "feedback wrong";
                }
            } else if (pasoActual === 2) {
                let res = parseInt(document.getElementById('resultadoFinal').value);
                if (res === resultado_correcto) {
                    msj.innerText = "¡Logrado! 🌟🌟🌟"; msj.className = "feedback correct";
                    document.getElementById('btnAccion').style.display = 'none';
                    cambiarTextoYHablar(`¡Lo hiciste de maravilla! Preparando el siguiente desafío...`);
                    setTimeout(() => { document.getElementById('btnAccion').style.display = 'inline-block'; generarNivel(); }, 5000);
                } else {
                    msj.innerText = modoJuego === 'suma' ? "Suma bien los números de la Fila Mágica 💪" : "Cuenta de nuevo las manzanas vivas 💪";
                    msj.className = "feedback wrong";
                }
            }
        }
    </script>
</body>
</html>
